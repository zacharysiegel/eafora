[workspace]
resolver = "2"
members = ["ingestion", "tools/seed_generator"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.52.*", features = ["full"] }
sqlx = { version = "0.8.*", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
reqwest = { version = "0.12.*", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
chrono = { version = "0.4.*", features = ["serde"] }
uuid = { version = "1.23.*", features = ["v7", "serde"] }
clap = "4.6.*"
log = "0.4.*"
env_logger = "0.11.*"
dotenvy = "0.15.*"
minimer = "2.1.*"
secr = "1.2.*"
rusqlite = { version = "0.32.*", features = ["bundled"] }
flatgeobuf = "4.6.*"
shapefile = "0.7.*"
zip = "4.5.*"
sha2 = "0.10.*"
aws-sigv4 = "1.3.*"
tempfile = "3.27.*"
