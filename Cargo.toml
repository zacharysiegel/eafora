[workspace]
resolver = "2"
members = ["shared", "ingestion", "tools/seed_generator", "web"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
shared = { path = "shared" }
tokio = { version = "1.52.*", default-features = false }
sqlx = { version = "0.8.*", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
reqwest = { version = "0.12.*", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
chrono = { version = "0.4.*", features = ["serde"] }
uuid = { version = "1.23.*", features = ["v7", "serde"] }
clap = "4.6.*"
log = "0.4.*"
env_logger = "0.11.*"
dotenvy = "0.15.*"
minimer = "2.1.*"
secr = "1.2.*"
rusqlite = { version = "0.32.*", features = ["bundled"] }
sqlite-wasm-rs = { version = "0.4.*", default-features = false, features = ["precompiled"] }
flatgeobuf = "4.6.*"
shapefile = { version = "0.7.*", features = ["geo-types"] }
zip = "4.5.*"
sha2 = "0.10.*"
aws-sdk-s3 = "1.135.*"
aws-config = "1.8.*"
bytes = "1.11.*"
base64 = "0.22.*"
const_format = "0.2.*"
geozero = { version = "0.14.*", default-features = false, features = ["with-geo"] }
geo-types = "0.7.*"
geo = "0.29.*"
tempfile = "3.27.*"
wasm-bindgen-test = "0.3.*"
web-sys = "0.3.*"
wgpu = { version = "30.0.*", default-features = false }
raw-window-handle = "0.6.*"
bytemuck = { version = "1.*", features = ["derive"] }
earcutr = "0.5.*"

# web client (Leptos/WASM); consumed by the web/ crate
leptos = "0.8.*"
leptos_router = "0.8.*"
leptos_meta = "0.8.*"
leptos_axum = "0.8.*"
axum = "0.8.*"
leptos_i18n = "0.6.*"
leptos_i18n_build = "0.6.*"
wasm-bindgen = "0.2.*"
wasm-bindgen-futures = "0.4.*"
js-sys = "0.3.*"
gloo-net = "0.5.*"
console_log = "0.2.*"
console_error_panic_hook = "0.1.*"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
