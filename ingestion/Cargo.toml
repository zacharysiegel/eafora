[package]
name = "ingestion"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
# Forwards shared's test-only enum variants (e.g. StatisticKind::TestAlpha) into ingestion's
# test build. Run the test suite with `--features testing`; a dev-dependency feature would leak
# into the normal binary build (feature unification) and make the source-kind match non-exhaustive.
testing = ["shared/testing"]

[dependencies]
shared = { workspace = true }
tokio = { workspace = true, features = ["full"] }
sqlx = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
dotenvy = { workspace = true }
minimer = { workspace = true }
secr = { workspace = true }
rusqlite = { workspace = true }
flatgeobuf = { workspace = true }
shapefile = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
const_format = { workspace = true }
geozero = { workspace = true }
geo-types = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
