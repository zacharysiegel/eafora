<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
    <!-- A sheet with a 1px border, which at this size is the identity's hairline rule and also the only
         thing separating a white tile from a light browser tab strip. -->
    <rect x="0.5" y="0.5" width="15" height="15" fill="#ffffff" stroke="#111111" stroke-width="1" />
    <!-- Drawn as rectangles rather than set as text, so it needs no font present and stays crisp at any
         size. The identity's 1px stroke would vanish at 16px, so the mark is solid. -->
    <g fill="#d50000">
        <rect x="4" y="3" width="2" height="10" />
        <rect x="4" y="3" width="8" height="2" />
        <rect x="4" y="7" width="7" height="2" />
        <rect x="4" y="11" width="8" height="2" />
    </g>
</svg>
