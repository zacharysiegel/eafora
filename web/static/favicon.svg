<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
    <!-- Four values from the map's white-to-red ramp, lightest to darkest in reading order.
         The tile is otherwise transparent: there is no border and no paper. -->
    <rect x="2" y="2" width="6" height="6" fill="#f7d1d1"/>
    <rect x="8" y="2" width="6" height="6" fill="#ec8c8c"/>
    <rect x="2" y="8" width="6" height="6" fill="#e14747"/>
    <rect x="8" y="8" width="6" height="6" fill="#d50000"/>
</svg>
