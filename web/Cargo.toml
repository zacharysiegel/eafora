[package]
name = "web"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared = { workspace = true, features = ["render"] }
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_i18n = { workspace = true }
log = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Window",
    "Navigator",
    "Storage",
    "Performance",
    "StorageManager",
    "StorageEstimate",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemWritableFileStream",
    "WritableStream",
    "File",
    "Blob",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemRemoveOptions",
    "DomException",
    "Response",
    "HtmlCanvasElement",
    "Element",
    "Location",
    "EventTarget",
    "Event",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "RequestInit",
    "RequestCache",
] }
console_log = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
chrono = { workspace = true }

[build-dependencies]
leptos_i18n_build = { workspace = true }

# The headless-browser harness for the OPFS cache's #[wasm_bindgen_test] cases; the native ssr build has no browser tests.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[features]
hydrate = [
    "leptos/hydrate",
    "leptos_i18n/hydrate",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:base64",
    "dep:web-sys",
    "dep:console_log",
    "dep:console_error_panic_hook",
    "tokio/sync",
    "tokio/macros",
]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_i18n/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "tokio/rt",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/macros",
]

[package.metadata.leptos]
output-name = "eafora"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "static"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
lib-profile-release = "wasm-release"
