[package]
name = "shared"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
flatgeobuf = { workspace = true }
geozero = { workspace = true }
geo-types = { workspace = true }
minimer = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
const_format = { workspace = true }

# Not for wasm32: rusqlite bundles a C SQLite that can't compile to wasm32 (no libc). The
# `serialize` feature adds Connection::deserialize, used to open a shard's in-memory bytes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true, features = ["serialize"] }

# wasm32 only: uuid's `js` feature gives getrandom a browser RNG backend so the workspace-wide
# `v7` feature compiles for wasm32-unknown-unknown. shared uses Uuid only as a field type, but the
# dependency graph still needs a wasm getrandom backend to build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["sync", "macros", "rt"] }

# wasm32 only: test harness for `cargo test --target wasm32-unknown-unknown`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
