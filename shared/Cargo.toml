[package]
name = "shared"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
flatgeobuf = { workspace = true }
geozero = { workspace = true }
geo-types = { workspace = true }
minimer = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
const_format = { workspace = true }
bytemuck = { workspace = true, optional = true }
earcutr = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, default-features = false, features = ["sync"] }

[features]
# render: pulls the wgpu GPU stack. Off by default so the ingestion producer never links wgpu.
render = ["dep:wgpu", "dep:raw-window-handle", "dep:bytemuck", "dep:earcutr", "dep:tokio"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# rusqlite bundles a C SQLite that needs libc; `serialize` adds Connection::deserialize.
rusqlite = { workspace = true, features = ["serialize"] }
# native GPU backends (wasm32 gets webgpu/webgl below).
wgpu = { workspace = true, optional = true, features = ["metal", "vulkan", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom needs a browser RNG backend for the workspace uuid `v7` feature to build.
uuid = { workspace = true, features = ["js"] }
# the SQLite the shard reader's read-only VFS registers against (native uses rusqlite).
sqlite-wasm-rs = { workspace = true }
# WebGPU + WebGL2 browser backends (native gets metal/vulkan above).
wgpu = { workspace = true, optional = true, features = ["webgpu", "webgl", "wgsl"] }
# HtmlCanvasElement, the web renderer's surface target.
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["sync", "macros", "rt"] }

# test harness for `cargo test --target wasm32-unknown-unknown`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
