[package]
name = "shared"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
flatgeobuf = { workspace = true }
geozero = { workspace = true }
geo-types = { workspace = true }
minimer = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
const_format = { workspace = true }
bytemuck = { workspace = true, optional = true }
earcutr = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, default-features = false, features = ["sync"] }

[features]
# render: pulls the wgpu GPU stack. Off by default so the ingestion producer never links wgpu.
render = ["dep:wgpu", "dep:raw-window-handle", "dep:bytemuck", "dep:earcutr", "dep:tokio"]

# Not for wasm32: rusqlite bundles a C SQLite that can't compile to wasm32 (no libc). The
# `serialize` feature adds Connection::deserialize, used to open a shard's in-memory bytes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true, features = ["serialize"] }
# Not for wasm32: native GPU backends (Metal on Apple, Vulkan on the Linux CI host and Android).
# wasm32 gets webgpu/webgl below. A backend only exists if its wgpu feature is compiled in.
wgpu = { workspace = true, optional = true, features = ["metal", "vulkan"] }

# wasm32 only: uuid's `js` feature gives getrandom a browser RNG backend so the workspace-wide
# `v7` feature compiles for wasm32-unknown-unknown. shared uses Uuid only as a field type, but the
# dependency graph still needs a wasm getrandom backend to build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
# wasm32 only: the SQLite build the shard reader's read-only VFS registers against (native uses
# rusqlite instead). See shared/src/sqlite/ro_memory_vfs.rs for why the VFS exists.
sqlite-wasm-rs = { workspace = true }
# wasm32 only: WebGPU is the primary browser backend and WebGL2 the downlevel fallback; native gets
# metal/vulkan above. A backend only exists if its wgpu feature is compiled in.
wgpu = { workspace = true, optional = true, features = ["webgpu", "webgl"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["sync", "macros", "rt"] }

# wasm32 only: test harness for `cargo test --target wasm32-unknown-unknown`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
